<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 190">
  <title>瀏覽器向伺服器要網頁檔案</title>
  <desc>瀏覽器向遠方的伺服器要網頁檔案，伺服器把包含 HTML、CSS、JavaScript 的網頁檔案送回給瀏覽器畫出畫面。</desc>
  <defs>
    <marker id="bs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill: var(--sl-color-accent)"/>
    </marker>
  </defs>
  <rect x="16" y="45" width="130" height="95" rx="10" style="fill: var(--sl-color-gray-6); stroke: var(--sl-color-gray-4); stroke-width: 1.5"/>
  <text x="81" y="82" text-anchor="middle" font-size="16" style="fill: var(--sl-color-text)">瀏覽器</text>
  <text x="81" y="108" text-anchor="middle" font-size="14" style="fill: var(--sl-color-text)">畫出卡片畫面</text>
  <rect x="294" y="45" width="130" height="95" rx="10" style="fill: var(--sl-color-gray-6); stroke: var(--sl-color-gray-4); stroke-width: 1.5"/>
  <text x="359" y="82" text-anchor="middle" font-size="16" style="fill: var(--sl-color-text)">伺服器</text>
  <text x="359" y="108" text-anchor="middle" font-size="14" style="fill: var(--sl-color-text)">存放網頁檔案</text>
  <line x1="154" y1="72" x2="284" y2="72" marker-end="url(#bs-arrow)" style="stroke: var(--sl-color-accent); stroke-width: 2"/>
  <text x="220" y="58" text-anchor="middle" font-size="14" style="fill: var(--sl-color-text)">1. 要網頁檔案</text>
  <line x1="286" y1="115" x2="156" y2="115" marker-end="url(#bs-arrow)" style="stroke: var(--sl-color-accent); stroke-width: 2"/>
  <text x="220" y="142" text-anchor="middle" font-size="14" style="fill: var(--sl-color-text)">2. 送回網頁檔案</text>
</svg>
