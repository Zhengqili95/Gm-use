contract: 1
id: lesson-1/ex-2
type: preview
title: "幫卡片換上淡黃色背景與留白"
goal: "把卡片的背景顏色改成淡黃色（lightyellow），內距改成 24px"
minutes: 2
files:
  index.html: |
    <link rel="stylesheet" href="style.css">
    <article class="card">
      <h2 id="title">寫一封請假信</h2>
      <p id="body">請幫我寫一封給老師的請假信，語氣有禮貌，100 字以內。</p>
      <p class="meta"><span id="tag">寫作</span></p>
      <button id="fav" type="button">☆ 收藏</button>
    </article>
  style.css: |
    .card {
      background-color: white;
      padding: 8px;
      border: 1px solid #cccccc;
      border-radius: 8px;
    }
editable: [style.css]
solution:
  style.css: |
    .card {
      background-color: lightyellow;
      padding: 24px;
      border: 1px solid #cccccc;
      border-radius: 8px;
    }
checks:
  - id: card-bg-color
    type: style
    selector: ".card"
    property: background-color
    equals: "lightyellow"
    hint: "卡片的背景顏色還不是淡黃色；檢查 .card 裡面的 background-color 冒號後面是不是寫 lightyellow。"
  - id: card-padding-top
    type: style
    selector: ".card"
    property: padding-top
    equals: "24px"
    hint: "卡片的內距還不是 24px；檢查 .card 裡面的 padding 冒號後面是不是寫 24px（記得加上單位 px）。"
hints:
  - "CSS 用「CSS 屬性: 值;」的格式設定外觀，背景顏色和內距都寫在選擇器的大括號裡面。"
  - "看 style.css 裡面 .card 的前兩行，分別修改 background-color 和 padding 冒號後面的值。"
  - "background-color: lightblue; 和 padding: 16px; 會把背景改成淡藍色、內距改成 16 像素。"
success: "卡片變得好讀多了！你看，只改 CSS 就能換掉顏色與留白，完全不用動到 HTML 的文字。"
